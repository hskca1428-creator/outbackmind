services:
  caddy:
    image: caddy:2
    container_name: outbackmind_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  frontend:
    image: nginx:alpine
    container_name: outbackmind_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  api:
    image: python:3.11-slim
    container_name: outbackmind_api
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pip install --no-cache-dir fastapi==0.140.0 starlette==1.3.1 uvicorn==0.51.0 pydantic==2.13.4 SQLAlchemy==2.0.51 psycopg2-binary==2.9.12 openai==2.48.0 qdrant-client==1.18.0 reportlab==5.0.0 redis==5.2.1 && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: ${QDRANT_URL}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-100}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-1000}
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./api:/app
      - ./knowledge:/app/knowledge

  postgres:
    image: postgres:16
    container_name: outbackmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: outbackmind
      POSTGRES_USER: outbackmind_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: outbackmind_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: outbackmind_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  qdrant_data:
