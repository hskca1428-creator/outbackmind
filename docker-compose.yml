services:
  caddy:
    image: caddy:2
    container_name: outbackmind_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  frontend:
    image: nginx:alpine
    container_name: outbackmind_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  api:
    build: ./api
    image: outbackmind-api:latest
    container_name: outbackmind_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: ${QDRANT_URL}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-100}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-1000}
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./knowledge:/app/knowledge:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: outbackmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: outbackmind
      POSTGRES_USER: outbackmind_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: outbackmind_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: outbackmind_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  qdrant_data:
